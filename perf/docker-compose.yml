# Results backend for the k6 scenarios: Prometheus stores the metrics k6
# streams over remote write, Grafana renders the QA dashboard on top.
#
# Neither container touches the application under test -- k6 runs on the
# host against a local gunicorn (perf/scripts/run.sh), and only its
# *results* come here. So this stack can be started, stopped, or wiped
# without affecting anything the API does.
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: lens-perf-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # k6 pushes rather than exposing a scrape target; without this the
      # /api/v1/write endpoint returns 404 and every run silently loses
      # its metrics.
      - --web.enable-remote-write-receiver
      # Long enough to compare this week's run against last week's,
      # short enough that the volume stays small.
      - --storage.tsdb.retention.time=15d
      # Series must stop cleanly when a run ends, or every graph grows a
      # five-minute flat tail (Prometheus' default lookback) that reads as
      # "the load carried on". k6's own stale markers would do this, but
      # they discard the final flush and undercount every total by roughly
      # one push interval -- measured at ~17% on a 30s run. Expiring the
      # lookback instead keeps the totals exact.
      #
      # Must stay above k6's K6_PROMETHEUS_RW_PUSH_INTERVAL (5s, set in
      # perf/scripts/run.sh) or live graphs go gappy mid-run.
      - --query.lookback-delta=15s
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10

  grafana:
    image: grafana/grafana:11.5.1
    container_name: lens-perf-grafana
    # 3000 is already the front end's static server (Front-end/, and
    # Flask's default CORS origin list), so the dashboard lives on 3001.
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # A QA tester opening a load-test dashboard should not first have to
      # be given an account. Nothing here is writable and nothing leaves
      # the machine.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      # Land straight on the dashboard instead of an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/qa-performance.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy

volumes:
  prometheus-data:
  grafana-data:
