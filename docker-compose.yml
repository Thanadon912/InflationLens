services:
  backend:
    build:
      context: ./Back-end
      dockerfile: Dockerfile
    container_name: inflation-lens-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - WORKERS=4
      - THREADS=4
      - INFLATION_DB_PATH=/app/instance/inflation_lens.sqlite3
      - AUTO_SEED=1
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5000
      - RATE_LIMIT_ENABLED=1
    volumes:
      - backend-data:/app/instance
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./Front-end
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: inflation-lens-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend-data:
