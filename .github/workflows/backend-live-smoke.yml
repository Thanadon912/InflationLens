name: Backend Live Provider Smoke

# Read-only calls to the real BLS/FRED/BEA/Eurostat/ECB/World Bank APIs
# (tests/integration/test_live_smoke.py) -- detects upstream schema drift
# that a fully-mocked PR suite structurally cannot. Deliberately not run
# on every PR/push: it depends on third-party uptime and secrets, so it
# belongs on a schedule.
on:
  schedule:
    - cron: "0 6 * * *" # daily, 06:00 UTC
  workflow_dispatch: {}

jobs:
  live-smoke:
    name: pytest -m live
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Back-end
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev]'

      - name: Run live provider smoke tests
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
        run: .venv/bin/python -m pytest -q -m live tests/integration/test_live_smoke.py
