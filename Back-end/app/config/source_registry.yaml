config_version: "source-registry-1.0.0"
defaults:
  monthly_backfill_periods: 24
  quarterly_backfill_periods: 8
  sync_stale_hours: 48
  monthly_stale_days: 62
  quarterly_stale_days: 150
  metadata_stale_days: 30
  cross_source_index_tolerance: 0.01

