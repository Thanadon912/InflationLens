  - {geography: USA, indicator_id: essential_cost_inflation, role: category_index, component_id: food, provider: bls, series_id: CUUR0000SAF1, frequency: monthly, unit: index, seasonally_adjusted: false, primary: true}
  - {geography: USA, indicator_id: essential_cost_inflation, role: category_index, component_id: housing, provider: bls, series_id: CUUR0000SAH1, frequency: monthly, unit: index, seasonally_adjusted: false, primary: true}
  - {geography: USA, indicator_id: essential_cost_inflation, role: category_index, component_id: energy, provider: bls, series_id: CUUR0000SA0E, frequency: monthly, unit: index, seasonally_adjusted: false, primary: true}
