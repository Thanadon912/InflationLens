# ISO 3166-1 alpha-3 -> numeric join table.
#
# World Bank's indicator API identifies countries by `countryiso3code`
# (alpha-3, e.g. "USA"). world-atlas's `countries-110m.json` (the TopoJSON
# the frontend map renders) keys every feature on ISO 3166-1 **numeric**
# (e.g. 840), per Natural Earth's `iso_n3` field. There is no provider that
# returns numeric directly, so this table is the unavoidable join between
# the two. ISO 3166-1 is a fixed standard; this list does not need updates
# except when a new country code is assigned.
#
# A readable subset, not the full ISO list: sovereign states and the
# dependent territories World Bank publishes CPI for. Entries absent here
# simply render unshaded on the choropleth rather than failing the request.
