# Census Bureau region assignment by 2-digit state FIPS code.
#
# us-atlas's `states-10m.json` (the TopoJSON the frontend state map renders)
# keys every feature on the 2-digit FIPS string, e.g. "48" = Texas. Regional
# CPI (`source_registry.yaml`'s `headline_consumer_inflation` mappings with
# a `region_id`) is the only geography BLS publishes below the national
# level, so every state inherits its region's *published* rate rather than
# a per-state estimate (README.md "Backend integration", point 3: BLS
# publishes no state-level CPI at all).
config_version: "us-regions-1.0.0"
regions:
  Northeast: ["09", "23", "25", "33", "44", "50", "34", "36", "42"]
  Midwest: ["17", "18", "26", "39", "55", "19", "20", "27", "29", "31", "38", "46"]
  South: ["10", "11", "12", "13", "24", "37", "45", "51", "54", "01", "21", "28", "47", "05", "22", "40", "48"]
  West: ["04", "08", "16", "30", "32", "35", "49", "56", "02", "06", "15", "41", "53"]
