<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inflation Lens — workbench</title>
    <style id="page-loader-style">
      #page-loader {
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #0c141e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 1;
        transition: opacity 0.35s cubic-bezier(0.16, 1, 0.3, 1), transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: auto;
      }
      #page-loader.fade-out {
        opacity: 0;
        transform: scale(1.02);
        pointer-events: none;
      }
      .loader-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 24px;
        position: relative;
      }
      .loader-reticle {
        position: relative;
        width: 48px;
        height: 48px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #749dc4;
      }
      .loader-reticle svg {
        width: 26px;
        height: 26px;
        animation: reticle-pulse 2s ease-in-out infinite;
      }
      .loader-reticle::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px dashed rgba(116, 157, 196, 0.35);
        border-radius: 50%;
        animation: reticle-spin 10s linear infinite;
      }
      .loader-brand {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #eef6ff;
      }
      .loader-track {
        width: 140px;
        height: 2px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      .loader-runner {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 50px;
        background: linear-gradient(90deg, transparent, #749dc4, #b5d9fd, transparent);
        animation: loader-slide 1.25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .loader-status {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: rgba(181, 217, 253, 0.55);
      }
      @keyframes reticle-pulse {
        0%, 100% { transform: scale(1); opacity: 0.85; }
        50% { transform: scale(1.1); opacity: 1; }
      }
      @keyframes reticle-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes loader-slide {
        0% { transform: translateX(-50px); }
        100% { transform: translateX(140px); }
      }
      @media (prefers-reduced-motion: reduce) {
        .loader-reticle svg, .loader-reticle::after, .loader-runner {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="page-loader" role="status" aria-live="polite" aria-label="Loading page">
      <div class="loader-box">
        <div class="loader-reticle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75">
            <circle cx="11" cy="11" r="7" />
            <path d="M11 7v8M7 11h8" />
            <path d="M16.2 16.2 21 21" />
          </svg>
        </div>
        <div class="loader-brand">INFLATION LENS</div>
        <div class="loader-track">
          <div class="loader-runner"></div>
        </div>
        <div class="loader-status">INITIALIZING WORKBENCH INTERFACE</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main-workbench.tsx"></script>
  </body>
</html>
